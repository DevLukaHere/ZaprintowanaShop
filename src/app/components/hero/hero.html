<section class="hero" [style.background-image]="'linear-gradient(rgba(251, 245, 242, 0.85), rgba(251, 245, 242, 0.85)), url(' + backgroundImage + ')'">
  <span class="hero__rule"></span>
  <p class="eyebrow">Ekskluzywne Zaproszenia</p>
  <h1 class="hero__title">Twój Wielki Dzień</h1>
  <p class="hero__subtitle">
    Zaproszenia, które będą wspomnieniem na wieczność. Rzemiosło, subtelny styl i detale
    dopracowane w każdym calu.
  </p>
  <a class="btn btn--primary" routerLink="/gallery">Odkryj Kolekcję</a>
</section>
