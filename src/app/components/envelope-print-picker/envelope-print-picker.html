<div class="print-picker">
  <div class="print-picker__grid">
    @for (option of options(); track option.id) {
      <button
        type="button"
        class="print-picker__tile"
        [class.print-picker__tile--active]="option.id === selectedId()"
        (click)="select(option)"
        [attr.aria-pressed]="option.id === selectedId()"
      >
        <span class="print-picker__media">
          @if (option.image) {
            <img [src]="option.image" [alt]="option.label" />
          } @else {
            <span class="print-picker__media-placeholder">Podgląd wkrótce</span>
          }

          @if (option.image) {
            <span
              class="print-picker__zoom"
              role="button"
              tabindex="0"
              (click)="openZoom($event, option)"
              (keydown.enter)="openZoom($event, option)"
              (keydown.space)="openZoom($event, option)"
              [attr.aria-label]="'Powiększ: ' + option.label"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
            </span>
          }
        </span>

        <span class="print-picker__info">
          <span class="print-picker__label">{{ option.label }}</span>
          <span class="print-picker__price">+ {{ option.price | price }}</span>
        </span>
      </button>
    }
  </div>

  @if (zoomed(); as option) {
    <div class="print-picker__lightbox" (click)="closeZoom()">
      <img [src]="option.image" [alt]="option.label" />
      <button type="button" class="print-picker__lightbox-close" aria-label="Zamknij">×</button>
    </div>
  }
</div>
