<header class="admin-header">
  <div class="admin-header__brand-group">
    <div class="admin-header__brand">
      <span class="admin-header__logo">Zaprintowana</span>
      <span class="admin-header__subtitle">Panel administracyjny</span>
    </div>

    <a class="admin-header__back" routerLink="/">Wróć do sklepu</a>
  </div>

  <nav class="admin-header__tabs">
    <a
      class="admin-header__tab"
      [class.admin-header__tab--active]="active() === 'orders'"
      routerLink="/admin"
    >
      Zamówienia
    </a>
    <a
      class="admin-header__tab"
      [class.admin-header__tab--active]="active() === 'products'"
      routerLink="/admin/products"
    >
      Produkty
    </a>
    <a
      class="admin-header__tab"
      [class.admin-header__tab--active]="active() === 'messages'"
      routerLink="/admin/messages"
    >
      Wiadomości
    </a>
  </nav>

  <div class="admin-header__account">
    @if (adminEmail(); as email) {
      <span class="admin-header__email">{{ email }}</span>
    }
    <button type="button" class="admin-header__signout" (click)="signOut()">Wyloguj</button>
  </div>
</header>
