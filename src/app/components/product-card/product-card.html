<article class="product-card">
  <a
    class="product-card__link"
    [routerLink]="['/produkt', product().id]"
    (mouseenter)="startCycle()"
    (mouseleave)="stopCycle()"
  >
    <span class="product-card__media">
      @if (product().imageUrl) {
        <img class="product-card__image" [src]="product().imageUrl" [alt]="product().name" />
      } @else {
        <span class="product-card__image product-card__image--placeholder"></span>
      }

      @if (hasOverlay()) {
        <img
          class="product-card__image product-card__image--hover"
          [src]="overlayImage()"
          alt=""
          aria-hidden="true"
        />
      }
    </span>

    <span class="product-card__body">
      @if (categoryCaption()) {
        <span class="product-card__category">{{ categoryCaption() }}</span>
      }
      <span class="product-card__name">{{ product().name }}</span>
      <span class="product-card__price">{{ product().price | price: true }}</span>
    </span>
  </a>

  @if (product().badge) {
    <span class="product-card__badge">{{ product().badge }}</span>
  }

  <button
    type="button"
    class="product-card__wishlist"
    [class.product-card__wishlist--active]="cart.isWishlisted(product().id)"
    (click)="cart.toggleWishlist(product().id)"
    [attr.aria-label]="'Dodaj ' + product().name + ' do ulubionych'"
    [attr.aria-pressed]="cart.isWishlisted(product().id)"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
    </svg>
  </button>
</article>
