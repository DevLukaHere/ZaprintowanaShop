<main class="admin-login">
  <form class="admin-login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="admin-login__brand">
      <span class="admin-login__logo">Zaprintowana</span>
      <span class="admin-login__subtitle">Panel administracyjny</span>
    </div>

    <label class="field">
      <span class="field__label">E-mail</span>
      <input type="email" formControlName="email" autocomplete="username" />
    </label>

    <label class="field">
      <span class="field__label">Hasło</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (errorMessage(); as message) {
      <p class="admin-login__error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="btn btn--primary" [disabled]="submitting()">
      {{ submitting() ? 'Logowanie…' : 'Zaloguj się' }}
    </button>

    <a class="admin-login__back" routerLink="/">← Wróć do sklepu</a>
  </form>
</main>
